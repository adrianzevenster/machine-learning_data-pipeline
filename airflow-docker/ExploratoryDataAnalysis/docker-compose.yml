services:
  python-app:
    build: .
    volumes:
      - ./output:/app/output
    environment:
      - MYSQL_HOST=flaskapp-flaskapp-db-1
      - MYSQL_USER=${APP_MYSQL_USER:-spark}
      - MYSQL_PASSWORD=${APP_MYSQL_PASSWORD:-sparkpw}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-RawData}
    networks:
      - shared-network
    deploy:
      resources:
        limits:
          memory: 4G

networks:
  shared-network:
    external: true
