
services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB:-airflow}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [airflow-network]

  redis:
    image: redis:6
    container_name: airflow-redis
    networks: [airflow-network]

  custom-airflow:
    build: .
    image: custom-airflow:latest
    profiles: ["build"]
    command: ["version"]
    networks: [airflow-network]

  mysql:
    image: mysql:8.0
    container_name: local-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-RawData}
      MYSQL_USER: ${SPARK_MYSQL_USER:-spark}
      MYSQL_PASSWORD: ${SPARK_MYSQL_PASSWORD:-sparkpw}
    volumes:
      - mydb_data:/var/lib/mysql
      - ./mysql/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 30s
      retries: 5
    networks: [airflow-network]
    # ports:
    #   - "3307:3306"    # host 3307 → container 3306

  airflow-init:
    image: custom-airflow:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@postgres/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW_UID: "50000"
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
      AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME:-Airflow}
      AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME:-Admin}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
    command:
      - "bash"
      - "-c"
      - |
        set -e
        airflow db upgrade
        airflow users delete --username "$${AIRFLOW_ADMIN_USERNAME}" || true
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USERNAME}" --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname "$${AIRFLOW_ADMIN_FIRSTNAME}" --lastname "$${AIRFLOW_ADMIN_LASTNAME}" \
          --role Admin --email "$${AIRFLOW_ADMIN_EMAIL}"
    networks: [ airflow-network ]

  airflow-webserver:
    build: .
    image: custom-airflow:latest
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      AIRFLOW_DOCKER_NETWORK: "airflow-network"
      AIRFLOW_CONN_FLASK_SERVICE: "http://flaskapp:5000"
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@postgres/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@postgres/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW__WEBSERVER__RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
      AIRFLOW_UID: "50000"
    command: ["webserver"]
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./flaskapp:/opt/airflow/flaskapp
      - ./pySpark:/opt/airflow/pyspark
      - ./ExploratoryDataAnalysis:/opt/airflow/eda
    networks: [airflow-network]

  airflow-scheduler:
    image: custom-airflow:latest
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      AIRFLOW_DOCKER_NETWORK: "airflow-network"
      AIRFLOW_CONN_FLASK_SERVICE: "http://flaskapp:5000"
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@postgres/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@postgres/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW_UID: "50000"
    command: ["scheduler"]
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./flaskapp:/opt/airflow/flaskapp
      - ./pySpark:/opt/airflow/pyspark
      - ./ExploratoryDataAnalysis:/opt/airflow/eda
    networks: [airflow-network]

  airflow-worker:
    image: custom-airflow:latest
    user: "50000:999"
    group_add:
      - "999"
    container_name: airflow-worker
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      AIRFLOW_DOCKER_NETWORK: "airflow-network"
      AIRFLOW_CONN_FLASK_SERVICE: "http://flaskapp:5000"
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@postgres/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@postgres/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW_UID: "50000"
    command: ["celery", "worker"]
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./flaskapp:/opt/airflow/flaskapp
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
      - ./pySpark:/opt/airflow/pyspark
      - ./ExploratoryDataAnalysis:/opt/airflow/eda
    networks: [airflow-network]

  flaskapp:
    build: ./flaskapp
    image: flaskapp-flaskapp-app:latest
    container_name: flaskapp-container
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USER: ${APP_MYSQL_USER:-spark}
      DB_PASSWORD: ${APP_MYSQL_PASSWORD:-sparkpw}
      DB_NAME: ${MYSQL_DATABASE:-RawData}
      DATABASE_URL: mysql+pymysql://${APP_MYSQL_USER:-spark}:${APP_MYSQL_PASSWORD:-sparkpw}@mysql:3306/${MYSQL_DATABASE:-RawData}
    command: >
      sh -c "python DataBase.py && gunicorn --bind 0.0.0.0:5000 --workers ${GUNICORN_WORKERS:-2} --threads ${GUNICORN_THREADS:-4} --timeout ${GUNICORN_TIMEOUT:-120} streamingestion:app"
    networks: [airflow-network]
    # ports:
    #   - "5001:5000"

  python-app:
    build:
      context: ./ExploratoryDataAnalysis
    image: python-app:latest
    profiles: ["build"]
    container_name: python-app-container
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${APP_MYSQL_USER:-spark}
      MYSQL_PASSWORD: ${APP_MYSQL_PASSWORD:-sparkpw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-RawData}
    volumes:
      - ./output:/app/output
    command: >
      bash -c "python main.py && python EDA.py"
    networks: [airflow-network]

  pyspark-app:
    build:
      context: ./pySpark
    image: pyspark-app:latest
    profiles: ["build"]
    command: >
      sh -c "python3 /app/PySparkAnalysis.py"
    networks: [airflow-network]

  model-monitoring:
    build:
      context: .
      dockerfile: ./model_monitoring/Dockerfile
    image: model-monitoring:latest
    profiles: ["build"]
    container_name: model-monitoring-container
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${APP_MYSQL_USER:-spark}
      MYSQL_PASSWORD: ${APP_MYSQL_PASSWORD:-sparkpw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-RawData}
    volumes:
      - ./output:/app/output
    networks: [ airflow-network ]

volumes:
  postgres_data:
  mydb_data:

networks:
  airflow-network:
    name: airflow-network
    driver: bridge
