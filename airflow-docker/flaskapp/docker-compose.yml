services:
  flaskapp-app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=flaskapp-db
      - DB_USER=${APP_MYSQL_USER:-spark}
      - DB_PASSWORD=${APP_MYSQL_PASSWORD:-sparkpw}
      - DB_NAME=${MYSQL_DATABASE:-RawData}
      - DATABASE_URL=mysql+pymysql://${APP_MYSQL_USER:-spark}:${APP_MYSQL_PASSWORD:-sparkpw}@flaskapp-db:3306/${MYSQL_DATABASE:-RawData}
    depends_on:
      flaskapp-db:
        condition: service_healthy
    command: ["sh", "-c", "python DataBase.py && gunicorn --bind 0.0.0.0:5000 --workers ${GUNICORN_WORKERS:-2} --threads ${GUNICORN_THREADS:-4} --timeout ${GUNICORN_TIMEOUT:-120} streamingestion:app"]
    networks:
      - shared-network

  flaskapp-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-RawData}
      MYSQL_USER: ${APP_MYSQL_USER:-spark}
      MYSQL_PASSWORD: ${APP_MYSQL_PASSWORD:-sparkpw}
    ports:
      - "3307:3306"
    volumes:
      - ../mysql/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - shared-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  shared-network:
    external: true






